[package]
name = "ektaon"
description = "CLI tool to calculate the distance between two geographic points from a CSV file"
version = "1.2.0"
edition = "2024"

[dependencies]
clap        = { version = "4", features = ["derive"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1.0"
csv         = "1.4"
regex       = "1"
once_cell   = "1"
# Error
thiserror   = "2.0"
